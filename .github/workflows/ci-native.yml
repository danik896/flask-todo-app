name: Flask CI Native Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize SQLite Database
      run: |
        mkdir -p instance

    - name: Smoke test Flask server
      run: |
        python manage.py runserver -h 127.0.0.1 -p 7345 &
        SERVER_PID=$!
        sleep 5
        curl -f http://127.0.0.1:7345/ || (echo "Server failed to respond" && kill $SERVER_PID && exit 1)
        echo "Smoke test passed successfully!"
        kill $SERVER_PID
